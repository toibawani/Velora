<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-label="A planet on an elliptical orbit with the star at one focus and a velocity arrow along the tangent">
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8C4A2F" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="400" height="520" fill="#FFF9F1"/>
  <rect width="400" height="520" fill="url(#hatch)"/>
  <rect x="12" y="12" width="376" height="496" fill="none" stroke="#8C4A2F" stroke-opacity="0.32" stroke-width="1.5"/>
<ellipse cx="200" cy="268" rx="140" ry="86" fill="none" stroke="#2C2118" stroke-width="2.5"/>
  <circle cx="112" cy="268" r="15" fill="#8C4A2F" opacity="1"/>
  <circle cx="112" cy="268" r="34" fill="#8C4A2F" opacity="0.12"/>
  <circle cx="296" cy="216" r="9" fill="#2C2118" opacity="1"/>
  <line x1="112" y1="268" x2="296" y2="216" stroke="#6E5846" stroke-width="1.25" opacity="0.5" stroke-dasharray="4 6"/>
  <line x1="296" y1="216" x2="348" y2="176" stroke="#8C4A2F" stroke-width="2.5" opacity="1"/>
  <path d="M 348 176 l -14 2 l 6 12 z" fill="#8C4A2F"/>
  <text x="24" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6E5846">the star sits off-centre,</text>
  <text x="24" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6E5846">which is why it moves at all</text>
  <line x1="28" y1="470" x2="372" y2="470" stroke="#8C4A2F" stroke-opacity="0.22" stroke-width="1"/>
  <text x="28" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6E5846">PLATE 4 &#183; VELORA</text>
</svg>
