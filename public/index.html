<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6EFE4" />
    <script>
      // Resolve the theme before the first paint. ThemeContext applies the
      // stored preference too, but it runs after React mounts, which meant a
      // dark-mode visitor saw the cream page flash first. Same storage key
      // and the same three modes as ThemeContext; a localStorage that throws
      // (private browsing) simply falls through to "auto".
      (function () {
        try {
          var stored = localStorage.getItem('velora_theme_preference');
          var mode = stored === 'dark' || stored === 'light' ? stored : 'auto';
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var apply = function () {
            var dark = mode === 'dark' || (mode === 'auto' && systemDark);
            var root = document.documentElement;
            root.setAttribute('data-theme', dark ? 'dark' : 'light');
            root.style.colorScheme = dark ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#171009' : '#F6EFE4');
          };
          apply();
          // While the choice is "auto", follow the OS even before React is
          // up. Once React mounts ThemeContext owns this, but re-applying
          // the same attributes is harmless.
          if (window.matchMedia) {
            var media = window.matchMedia('(prefers-color-scheme: dark)');
            var onChange = function (event) {
              systemDark = event.matches;
              if (mode === 'auto') apply();
            };
            if (media.addEventListener) media.addEventListener('change', onChange);
            else if (media.addListener) media.addListener(onChange);
          }
        } catch (e) {
          /* No localStorage (private mode etc.). Light is the safe default. */
        }
      })();
    </script>
    <meta
      name="description"
      content="VELORA is a distraction-free, first-principles learning platform for physics, philosophy, and history."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>VELORA — Deep Concept Mastery &amp; Scientific Learning</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
