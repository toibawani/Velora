<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Content-Security-Policy, delivered as a meta tag because GitHub Pages
      cannot set response headers and there is no server in this project to set
      them for it. A meta policy only covers what comes after it in the
      document, which is why it sits above every link, script and stylesheet.

      What each part is for:
        default-src 'self'          nothing loads from another origin by default
        script-src 'self'           no inline script, no eval; the theme script
                                    is public/theme-init.js so it needs no hash
                                    and survives production minification
        style-src 'self' 'unsafe-inline'
                                    React writes style attributes and the
                                    bundler injects <style> tags in development;
                                    neither can be hashed
        img-src, connect-src        only this origin, plus the optional
                                    GoatCounter host when analytics is switched
                                    on (it is off by default and unconfigured)
        base-uri 'self'             an injected <base> cannot retarget links
        form-action 'none'          no form can navigate anywhere
        object-src 'none'           no plugin or Java applet surface

      Not here, because a meta tag cannot deliver them and GitHub Pages will
      not: frame-ancestors, X-Frame-Options, HSTS. docs/SECURITY.md says what
      that leaves open.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://*.goatcounter.com; media-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-src 'none'"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F6EFE4" />
    <!--
      Runs before the first paint, so it is a blocking classic script rather
      than a deferred one. It lives in public/ instead of inline because the CSP
      above does not allow inline script; see the comment in that file.
    -->
    <script src="%PUBLIC_URL%/theme-init.js"></script>
    <meta
      name="description"
      content="VELORA is a no-account reference book. Every topic is listed from day one, the ones with a lesson are marked written, and the rest say not written yet. Everything is stored in your browser."
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>VELORA: a reference book for curious people</title>

    <!--
      Open Graph + Twitter card. VELORA is a static SPA served from a subpath,
      so these describe the whole app rather than each shared lesson (a per-page
      crawler cannot run JavaScript). The text deliberately carries no counts:
      a number typed into this file would go stale the next time the atlas
      changes. The image is the app icon; a dedicated 1200x630 card would
      render better in a feed and can replace it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELORA" />
    <meta property="og:title" content="VELORA: a reference book for curious people" />
    <meta
      property="og:description"
      content="A no-account reference book. Every topic is listed from day one; the ones with nothing written behind them say so instead of opening a placeholder page. No server, no sign-up, nothing sent anywhere unless you switch analytics on."
    />
    <meta property="og:url" content="https://toibawani.github.io/Velora" />
    <meta property="og:image" content="https://toibawani.github.io/Velora/logo512.png" />
    <meta property="og:image:alt" content="VELORA" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VELORA: a reference book for curious people" />
    <meta
      name="twitter:description"
      content="A no-account reference book. Every topic is listed from day one; the ones with nothing written behind them say so instead of opening a placeholder page."
    />
    <meta name="twitter:image" content="https://toibawani.github.io/Velora/logo512.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
