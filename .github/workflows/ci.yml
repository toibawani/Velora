name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorship:
    name: commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The range below reaches back past the pushed tip, so the whole
          # history has to be present.
          fetch-depth: 0
      # The local commit-msg hook in .githooks is the first line of defence and
      # it is configuration, not code: a fresh clone, a runner, or any tool that
      # passes --no-verify never sees it. This runs the same rule on the commits
      # that actually arrived, so a trailer or a foreign identity cannot be
      # pushed quietly even if the hook was bypassed.
      - name: every new commit is mine and carries no credit trailer
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.sha }}"
            fi
          fi
          node scripts/commitAuthorship.js "$range"
  verify:
    name: tsc, jest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The lockfile needs npm 10. Printing the version first means a lockfile
      # failure names the toolchain instead of sending the next person to read
      # package-lock.json.
      - run: node --version && npm --version
      - run: npm ci
      # There was no CI at all until now: the build was broken by three dead
      # @import lines while 291 tests passed, so a green suite was not evidence.
      - run: npx tsc --noEmit
      - run: CI=true npx react-scripts test --watchAll=false --coverage
      - run: npm run build
      # Token contrast is a pure-node gate, so it belongs with the no-browser
      # checks. It reads the real values out of design-tokens.css, composites
      # translucent roles over the ground they sit on, and fails on anything
      # below WCAG AA (links, placeholders, focus, disabled, status states,
      # text on accent, muted metadata). A palette edit that drops a token below
      # AA now fails here rather than shipping cream-on-cream.
      - run: node scripts/checkContrast.js
      # Every file, tests included. This ran over app source only until the
      # 135 violations in the test files were paid off, and a lint that skips
      # the debt is how that debt grew: a test file could add a container
      # query or a conditional expectation and nothing said so.
      - run: npm run lint:all
  layout:
    name: layout regression (real Chrome, built app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every audit below drives real Chrome. If the runner image ever stops
      # shipping it, fail here with a clear message naming where it looked,
      # rather than four jobs later with "No Chrome found".
      - name: locate a browser
        run: node scripts/chrome.js
      # jsdom has no layout engine, so element-geometry regressions are invisible
      # to Jest. This drives the built output in real Chrome at 1440 and 375,
      # signs in through the real form and walks every screen.
      - run: npm run test:layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-artifacts-layout
          path: audit-artifacts/
          if-no-files-found: warn
      - run: npm run test:naming
      # The game audit plays every game in the built app in real Chrome and fails
      # if one cannot be reached or the page logs an error.
      #
      # This step was described as existing when only the npm script did: the
      # audit had never actually run in CI, which is how a selector bug made it
      # navigate out of the games screen and "pass" while testing one puzzle. A
      # check nobody runs is not a check, so it is wired up here and it blocks.
      - run: npm run test:games
      # The same argument applies to the atlas: the hidden search label and the
      # index-not-a-pill regressions are both invisible to Jest.
      - run: npm run test:a11y

  atlas:
    name: atlas coverage (real Chrome, built app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Same reason as the layout job: this one is about the browser, not the app.
      - name: locate a browser
        run: node scripts/chrome.js
      # Three atlas audits existed and were run by nobody. Each could report
      # success while verifying nothing, and two of them could only find Chrome
      # at a macOS path, so on this runner they would have exited before looking
      # at the app at all.
      #
      # They now resolve Chrome through scripts/chrome.js and exit non-zero when
      # they reach nothing or check less than they claim to. They are wired here
      # for the same reason the game audit is: a check nobody runs is not a
      # check, and one that cannot fail is worse than none.
      #
      # atlasTopicVerify: every tapped topic resolves to a lesson, a deep read,
      # or an honest "not written yet".
      - run: npm run test:atlas-topics
      # atlasTapAudit: every field and discipline has a live topic, and every
      # written topic's call to action opens real content.
      - run: npm run test:atlas-tap
      # levelsVerify: every level in the black hole rail renders real content.
      - run: npm run test:levels
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-artifacts-atlas
          path: audit-artifacts/
          if-no-files-found: warn
