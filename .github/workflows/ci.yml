name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tsc, jest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # There was no CI at all until now: the build was broken by three dead
      # @import lines while 291 tests passed, so a green suite was not evidence.
      - run: npx tsc --noEmit
      - run: CI=true npx react-scripts test --watchAll=false --coverage
      - run: npm run build
      # ESLint currently runs over app source only. Every remaining violation is
      # in *.test.* files and is tracked as debt; see the lint job below.
      - run: npm run lint

  layout:
    name: layout regression (real Chrome, built app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # jsdom has no layout engine, so element-geometry regressions are invisible
      # to Jest. This drives the built output in real Chrome at 1440 and 375,
      # signs in through the real form and walks every screen.
      - run: npm run test:layout
      - run: npm run test:naming
      # The game audit plays every game in the built app in real Chrome and fails
      # if one cannot be reached or the page logs an error.
      #
      # This step was described as existing when only the npm script did: the
      # audit had never actually run in CI, which is how a selector bug made it
      # navigate out of the games screen and "pass" while testing one puzzle. A
      # check nobody runs is not a check, so it is wired up here and it blocks.
      - run: npm run test:games
      # The same argument applies to the atlas: the hidden search label and the
      # index-not-a-pill regressions are both invisible to Jest.
      - run: npm run test:a11y
